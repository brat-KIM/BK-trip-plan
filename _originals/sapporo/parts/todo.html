<section class="panel" id="todo" aria-label="출발 전 할 일" hidden>
  <button type="button" class="back" data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>더보기</button>
  <div class="sec-head">
    <h2>출발 전 할 일</h2>
    <p>마감 순서대로. 체크하면 이 폰에 저장돼.</p>
    <div class="progress" id="todo-progress">0 / 0</div>
    <div class="bar"><i id="todo-bar"></i></div>
  </div>

  <div>
    <div class="cl-head"><h3>오늘~목요일</h3><span class="due">~10/15 목</span></div>
    <ul class="check" data-group="todo">
      <li><label><input type="checkbox" id="t-times"><span><b>타임즈 예약 다시 확인</b><span class="s">안심보상 코스, ETC 카드(330엔), <b>픽업 10/17 15:00</b>(변경 완료), 반납 10/20 12:00 풀주유. 여친도 운전하면 추가 운전자 등록.</span></span></label></li>
      <li><label><input type="checkbox" id="t-food"><span><b>식당 예약</b><span class="s">일 점심 마사즈시 본점 11:00, 일 저녁 RAZAN 18:30은 예약 완료. 월 저녁은 현장에서 맛집 탭 '찜 목록' 보고 골라. 운하 크루즈는 선택 (otaru.cc).</span></span></label></li>
      <li><label><input type="checkbox" id="t-bag"><span><b>파라타 수하물 확인</b><span class="s">위탁 15kg이 예약에 포함돼 있는지, 기내 가방 1개 10kg·55×40×20cm ★. 오는 편만 위탁할지 정하기.</span></span></label></li>
      <li><label><input type="checkbox" id="t-ins"><span><b>해외여행자보험 (둘 다)</b><span class="s">의료비, 휴대품, 항공 지연. 렌터카 사고는 타임즈 보상이 맡아.</span></span></label></li>
      <li><label><input type="checkbox" id="t-esim"><span><b>이심 2개 구매</b><span class="s">시골 산길이 있어서 도코모나 au 회선 상품 우선 ★. 하루 2GB 이상이나 무제한.</span></span></label></li>
    </ul>
  </div>

  <div>
    <div class="cl-head"><h3>금요일 18시까지</h3><span class="due">~10/16 금 18:00</span></div>
    <ul class="check" data-group="todo">
      <li><label><input type="checkbox" id="t-idp"><span><b>국제운전면허증</b><span class="s">평일만 돼. 운전면허시험장은 당일 발급, 경찰서는 발급 안 하는 곳도 있으니 미리 전화. 준비물: 운전면허증 + 6개월 안에 찍은 여권사진 1장, 수수료 9,000원. 온라인 신청은 우편이라 이미 늦었어. 여친도 운전하면 같이.</span></span></label></li>
      <li><label><input type="checkbox" id="t-name"><span><b>영문 이름 일치 확인</b><span class="s">여권, 국제면허, 렌트 예약, 운전자 명의 신용카드.</span></span></label></li>
      <li><label><input type="checkbox" id="t-money"><span><b>트래블GO 엔화 충전</b><span class="s">마스터카드라 일본 세븐뱅크 ATM 출금 수수료가 없어. 현금 2~3만 엔은 현지 ATM에서 뽑아도 돼 ('돈·세금' 탭).</span></span></label></li>
      <li><label><input type="checkbox" id="t-vjw"><span><b>Visit Japan Web 둘 다 등록</b><span class="s">여권, 항공편 WE531, 첫날 숙소 주소(유라쿠소안) → 입국·세관 QR.</span></span></label></li>
      <li><label><input type="checkbox" id="t-map"><span><b>구글맵 오프라인 지도 저장</b><span class="s">신치토세 ~ 시코쓰호 ~ 조잔케이 ~ 오타루 ~ 삿포로 범위.</span></span></label></li>
      <li><label><input type="checkbox" id="t-apps"><span><b>앱 설치</b><span class="s">GO(택시), 타베로그, 파파고, tenki.jp, Safety tips(재난 알림 한국어).</span></span></label></li>
      <li><label><input type="checkbox" id="t-smart"><span><b>인천공항 스마트패스 등록</b><span class="s">얼굴 등록해두면 출국장 줄이 짧아져.</span></span></label></li>
    </ul>
  </div>

  <div>
    <div class="cl-head"><h3>금요일 밤</h3><span class="due">10/16 금</span></div>
    <ul class="check" data-group="todo">
      <li><label><input type="checkbox" id="t-checkin"><span><b>파라타 온라인 체크인 · 좌석 지정</b><span class="s">열리는 시간은 앱에서 확인 ★.</span></span></label></li>
      <li><label><input type="checkbox" id="t-wx"><span><b>날씨 다시 확인</b><span class="s">tenki.jp 삿포로 예보.</span></span></label></li>
      <li><label><input type="checkbox" id="t-esim2"><span><b>이심 설치</b><span class="s">QR로 미리 설치, 데이터 로밍은 신치토세 도착해서 켜기.</span></span></label></li>
      <li><label><input type="checkbox" id="t-pack"><span><b>짐 싸기</b><span class="s">기내 가방 무게, 1L 지퍼백 ('짐·기내' 탭).</span></span></label></li>
    </ul>
  </div>

  <div>
    <div class="cl-head"><h3>토요일 아침</h3><span class="due">10/17 토</span></div>
    <ul class="check" data-group="todo">
      <li><label><input type="checkbox" id="t-pouch"><span><b>파우치 하나에 몰아넣기</b><span class="s">여권 2, 한국 면허증, 국제면허증, 운전자 명의 신용카드.</span></span></label></li>
      <li><label><input type="checkbox" id="t-icn"><span><b>08:15까지 인천공항 T1</b><span class="s">파라타 WE531 10:35 출발.</span></span></label></li>
    </ul>
  </div>
  <button type="button" class="reset" data-reset="todo">체크 전부 지우기</button>
</section>
