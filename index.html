  <section class="hub-hello" id="hello"><h1>여행 불러오는 중…</h1></section>
  <section class="hub-sec on-sky" id="sec-feature"><div id="feature"></div></section>
  <section class="hub-sec" id="sec-next" hidden><h2>그다음 여행 <span class="cnt" id="cnt-next"></span></h2><div class="minis" id="list-next"></div></section>
  <section class="hub-sec" id="sec-past" hidden><h2>다녀온 여행 <span class="cnt" id="cnt-past"></span></h2><div class="minis" id="list-past"></div></section>
  <p class="hub-foot">한 번 연 여행은 비행기 모드에서도 열려.</p>
</main>
<script src="/app/theme.js"></script>
<script>
(function () {
  'use strict';
  var TH = window.BKTheme;
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function diff(a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 86400000); }
  function p(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); var dt = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return { y: +m[1], m: +m[2], d: +m[3], wd: WD[dt.getUTCDay()] }; }
  function range(t, short) {
    var a = p(t.start), b = p(t.end || t.start), one = !t.end || t.end === t.start;
    if (short) return a.y + '.' + a.m + '.' + a.d + (one ? '' : '–' + (b.m !== a.m || b.y !== a.y ? b.m + '.' : '') + b.d);
    return a.m + '월 ' + a.d + '일 ' + a.wd + (one ? '' : ' – ' + (b.m !== a.m ? b.m + '월 ' : '') + b.d + '일 ' + b.wd);
  }
  function nights(t) { var n = diff(t.end || t.start, t.start); return n <= 0 ? '당일치기' : n + '박 ' + (n + 1) + '일'; }
  function themeOf(t) { var th = t.theme || {}; if (!th.glyph && t.cover && t.cover.glyph) th = Object.assign({ glyph: t.cover.glyph }, th); return th; }
  function gsize(g, max, width) { var n = Array.from(String(g)).length, latin = /^[ -~]+$/.test(g); return Math.max(18, Math.min(max, Math.floor(width / (n * (latin ? 0.8 : 1.06))))); }
  function vars(th) { var v = TH.vars(th), s = ''; for (var k in v) s += k + ':' + v[k].replace(/"/g, "'") + ';'; return s; }
  function who(t) { return (t.companions || []).length ? t.companions.join(', ') : ''; }

  /* 화면 모드 */
  var THEMES = ['auto', 'light', 'dark'];
  var ICON = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
  };
  var LABEL = { auto: '자동', light: '라이트', dark: '다크' };
  function getT() { try { return JSON.parse(localStorage.getItem('bk:theme')) || 'auto'; } catch (e) { return 'auto'; } }
  function setT(t) { try { localStorage.setItem('bk:theme', JSON.stringify(t)); } catch (e) {} }
  var btn = document.getElementById('theme');
  function paint(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    btn.innerHTML = ICON[t]; btn.setAttribute('aria-label', '화면 모드: ' + LABEL[t] + ' (누르면 바뀜)');
  }
  paint(getT());
  btn.addEventListener('click', function () { var t = THEMES[(THEMES.indexOf(getT()) + 1) % 3]; setT(t); paint(t); });

  /* 큰 포스터 카드: 진행 중이거나 바로 다음 여행 */
  function feature(t, kind, td) {
    var th = themeOf(t), g = th.glyph || '';
    var stk = kind === 'now' ? '<b>' + (diff(td, t.start) + 1) + '일차</b><span>여행 중</span>' : (diff(t.start, td) === 0 ? '<b>D-DAY</b><span>오늘 출발</span>' : '<b>D-' + diff(t.start, td) + '</b><span>출발까지</span>');
    return '<a class="pcard" href="/' + esc(t.slug) + '" style="' + vars(th) + '">' +
      '<div class="poster">' + TH.art(th, 'poster') + (g ? '<span class="pg" aria-hidden="true" style="--gsize:' + gsize(g, 66, 300) + 'px">' + esc(g) + '</span>' : '') + '<span class="stk">' + stk + '</span></div>' +
      '<div class="body"><h3>' + esc(t.title) + '</h3>' + (t.summary ? '<p class="sum">' + esc(t.summary) + '</p>' : '') +
      '<div class="chips"><span>' + range(t) + '</span><span>' + nights(t) + '</span>' + (who(t) ? '<span>' + esc(who(t)) + '</span>' : '') + '</div>' +
      '<span class="go">' + (kind === 'now' ? '지금 일정 보기' : '여행 열기') + '</span></div></a>';
  }
  /* 작은 포스터 카드 */
  function mini(t, td, next) {
    var th = themeOf(t), g = th.glyph || '';
    return '<a class="mini" href="/' + esc(t.slug) + '" style="' + vars(th) + '">' +
      '<div class="poster">' + TH.art(th, 'poster') + (g ? '<span class="pg" aria-hidden="true" style="--gsize:' + gsize(g, 28, next ? 92 : 130) + 'px">' + esc(g) + '</span>' : '') + (next ? '<span class="stk">D-' + diff(t.start, td) + '</span>' : '') + '</div>' +
      '<div class="body"><b>' + esc(t.title) + '</b><span>' + range(t, true) + ' · ' + nights(t) + '</span></div></a>';
  }

  function render(list) {
    var td = today(), now = [], next = [], past = [];
    list.forEach(function (t) {
      if (diff(t.start, td) > 0) next.push(t);
      else if (diff(td, t.end || t.start) > 0) past.push(t);
      else now.push(t);
    });
    next.sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    past.sort(function (a, b) { return a.start > b.start ? -1 : 1; });
    var feat = now[0] || next[0] || null, kind = now[0] ? 'now' : 'next';
    // 하늘: 허브는 항상 파란 여행 하늘 + 위쪽 귀여운 여행 그림(.hub-art). 여행별 색은 포스터 카드에서
    var skyTheme = { sky: ['#22408F', '#3A62B8', '#5A85D2', '#8EA8DF', '#D9B3B0'], accent: '#FF7A6B' };
    TH.apply(document.documentElement, skyTheme);
    var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', TH.merge(skyTheme).sky[0]);

    var h = document.getElementById('hello');
    if (now[0]) h.innerHTML = '<h1>지금 ' + esc(now[0].title) + ' 여행 중</h1><p>오늘은 ' + (diff(td, now[0].start) + 1) + '일차 · 카드 누르면 지금 일정이 바로 떠</p>';
    else if (next[0]) h.innerHTML = '<h1>다음 여행은 ' + esc(next[0].title) + '</h1><p>' + range(next[0]) + ' 출발 · ' + nights(next[0]) + (who(next[0]) ? ' · ' + esc(who(next[0])) : '') + '</p>';
    else h.innerHTML = '<h1>다음 여행은 어디로 갈까</h1><p>다녀온 여행 ' + past.length + '개가 아래에 모여 있어</p>';

    document.getElementById('feature').innerHTML = feat ? feature(feat, kind, td) :
      '<div class="empty-card"><b>아직 잡힌 여행이 없어</b><span>여행을 추가하면 여기에 포스터가 생겨.</span></div>';
    var rest = now.slice(1).concat(next.slice(feat && kind === 'next' ? 1 : 0));
    document.getElementById('sec-next').hidden = !rest.length;
    document.getElementById('cnt-next').textContent = rest.length || '';
    document.getElementById('list-next').innerHTML = rest.map(function (t) { return mini(t, td, diff(t.start, td) > 0); }).join('');
    // 하늘 높이 = 대표 카드 아래까지 (그 아래 목록은 종이 바탕 위에)
    requestAnimationFrame(function () {
      var f = document.getElementById('sec-feature').getBoundingClientRect();
      document.getElementById('sky').style.height = Math.round(f.top + window.scrollY + Math.min(f.height, 220) + 60) + 'px';
    });
    document.getElementById('sec-past').hidden = !past.length;
    document.getElementById('cnt-past').textContent = past.length || '';
    document.getElementById('list-past').innerHTML = past.map(function (t) { return mini(t, td, false); }).join('');
  }

  fetch('/trips.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) { render(d.trips || []); }, function () {
    document.getElementById('hello').innerHTML = '<h1>목록을 못 불러왔어</h1><p>인터넷 연결을 확인하고 다시 열어줘.</p>';
  });
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
})();
</script>
