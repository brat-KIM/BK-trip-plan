<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BK Trip</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="BK의 여행 모음">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BK Trip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Zen+Old+Mincho:wght@700&display=swap">
<link rel="stylesheet" href="/app/base.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body class="hub">
<main class="hub-wrap">
  <header class="hub-head">
    <a class="brand" href="/"><img src="/assets/icon.svg" alt="" width="40" height="40"><span><b>BK Trip</b><small>우리 여행 모음</small></span></a>
    <button class="theme-btn" id="theme" type="button" aria-label="화면 모드 바꾸기"></button>
  </header>
  <section class="hub-hello" id="hello"><h1>여행 불러오는 중…</h1></section>
  <section class="hub-sec" id="sec-now" hidden><h2>지금 여행 중</h2><div class="cards" id="list-now"></div></section>
  <section class="hub-sec" id="sec-next"><h2>다가오는 여행 <span class="cnt" id="cnt-next"></span></h2><div class="cards" id="list-next"></div></section>
  <section class="hub-sec" id="sec-past" hidden><h2>지난 여행 <span class="cnt" id="cnt-past"></span></h2><div class="cards past" id="list-past"></div></section>
  <p class="hub-foot">한 번 열어본 여행은 인터넷이 끊겨도 보여.</p>
</main>
<script>
(function () {
  'use strict';
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function diff(a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 86400000); }
  function p(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); var dt = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return { y: +m[1], m: +m[2], d: +m[3], wd: WD[dt.getUTCDay()] }; }
  function range(t, short) {
    var a = p(t.start), b = p(t.end || t.start);
    if (short) return a.y + '.' + a.m + '.' + a.d + (t.end && t.end !== t.start ? '–' + (b.m !== a.m || b.y !== a.y ? b.m + '.' : '') + b.d : '');
    var s = a.y + '.' + a.m + '.' + a.d + ' (' + a.wd + ')';
    if (t.end && t.end !== t.start) s += ' – ' + (b.y !== a.y ? b.y + '.' : '') + (b.m !== a.m || b.y !== a.y ? b.m + '.' : '') + b.d + ' (' + b.wd + ')';
    return s;
  }
  function nights(t) { var n = diff(t.end || t.start, t.start); return n <= 0 ? '당일치기' : n + '박 ' + (n + 1) + '일'; }

  /* 테마 */
  var THEMES = ['auto', 'light', 'dark'];
  var ICON = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
  };
  var LABEL = { auto: '자동', light: '라이트', dark: '다크' };
  function getT() { try { return JSON.parse(localStorage.getItem('bk:theme')) || 'auto'; } catch (e) { return 'auto'; } }
  function setT(t) { try { localStorage.setItem('bk:theme', JSON.stringify(t)); } catch (e) {} }
  var btn = document.getElementById('theme');
  function paint(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    btn.innerHTML = ICON[t]; btn.setAttribute('aria-label', '화면 모드: ' + LABEL[t] + ' (누르면 바뀜)');
  }
  paint(getT());
  btn.addEventListener('click', function () { var t = THEMES[(THEMES.indexOf(getT()) + 1) % 3]; setT(t); paint(t); });

  function card(t, kind, td) {
    var c = t.cover || {}, cols = c.colors || ['#B83A2B', '#21607A'];
    var badge = '';
    if (kind === 'now') badge = '<span class="badge live">여행 중 · ' + (diff(td, t.start) + 1) + '일차</span>';
    else if (kind === 'next') { var d = diff(t.start, td); badge = '<span class="badge">' + (d === 0 ? 'D-DAY' : 'D-' + d) + '</span>'; }
    var who = (t.companions || []).length ? (t.companions.join(', ') + '랑') : '';
    return '<a class="tcard" href="/' + esc(t.slug) + '">' +
      '<div class="cover" style="--g1:' + esc(cols[0]) + ';--g2:' + esc(cols[1] || cols[0]) + '">' +
      (c.image ? '<img src="/trips/' + esc(t.slug) + '/' + esc(c.image) + '" alt="" loading="lazy">' : '') +
      (c.glyph && !c.image ? '<span class="glyph" aria-hidden="true">' + esc(c.glyph) + '</span>' : '') +
      badge + (t.region ? '<span class="region">' + esc(t.region) + '</span>' : '') + '</div>' +
      '<div class="meta2"><h3>' + esc(t.title) + '</h3>' + (t.summary ? '<p class="sum">' + esc(t.summary) + '</p>' : '') +
      '<div class="facts2"><span>' + range(t, kind === 'past') + '</span><span>' + nights(t) + '</span>' + (who ? '<span>' + esc(who) + '</span>' : '') + '</div></div></a>';
  }

  function render(list) {
    var td = today(), now = [], next = [], past = [];
    list.forEach(function (t) {
      if (diff(t.start, td) > 0) next.push(t);
      else if (diff(td, t.end || t.start) > 0) past.push(t);
      else now.push(t);
    });
    next.sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    past.sort(function (a, b) { return a.start > b.start ? -1 : 1; });
    document.getElementById('sec-now').hidden = !now.length;
    document.getElementById('list-now').innerHTML = now.map(function (t) { return card(t, 'now', td); }).join('');
    document.getElementById('cnt-next').textContent = next.length || '';
    document.getElementById('list-next').innerHTML = next.length ? next.map(function (t) { return card(t, 'next', td); }).join('') :
      '<div class="empty-card"><b>아직 잡힌 여행이 없어</b><span>클로드한테 “새 여행 추가해줘: 제목, 날짜”라고 하면 이 자리에 카드가 생겨.</span></div>';
    document.getElementById('sec-past').hidden = !past.length;
    document.getElementById('cnt-past').textContent = past.length || '';
    document.getElementById('list-past').innerHTML = past.map(function (t) { return card(t, 'past', td); }).join('');
    var h = document.getElementById('hello');
    if (now.length) h.innerHTML = '<h1>지금 ' + esc(now[0].title) + ' 여행 중</h1><p>오늘은 ' + (diff(td, now[0].start) + 1) + '일차. 카드 눌러서 지금 일정 바로 봐.</p>';
    else if (next.length) { var d = diff(next[0].start, td); h.innerHTML = '<h1>' + esc(next[0].title) + '까지 ' + (d === 0 ? '오늘 출발!' : 'D-' + d) + '</h1><p>' + range(next[0]) + ' · ' + nights(next[0]) + '</p>'; }
    else h.innerHTML = '<h1>다음 여행은 어디로 갈까</h1><p>지난 여행 ' + past.length + '개가 여기 모여 있어.</p>';
  }

  fetch('/trips.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) { render(d.trips || []); }, function () {
    document.getElementById('hello').innerHTML = '<h1>목록을 못 불러왔어</h1><p>인터넷 연결을 확인하고 다시 열어줘.</p>';
  });
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
})();
</script>
</body>
</html>
